<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Archive</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <div class="landing">
        <section class="landing-banner">
            <div class="marquee-viewport">
                <div class="marquee-track" id="marquee-track"></div>
            </div>
            <div class="banner-overlay">
                <h1 class="banner-title">PINTEREST<br>ARCHIVE</h1>
            </div>
            <div class="banner-meta">
                <span id="pin-count">— pins</span>
                <span class="banner-dot">●</span>
                <span id="banner-date"></span>
            </div>
            <span class="banner-eye" aria-hidden="true">◉</span>
        </section>

        <section class="landing-lower">
            <div class="lower-left">
                <span class="vertical-label">Archive*</span>
                <a href="gallery.html" class="enter-link">ENTER THE<br>TUNNEL →</a>
            </div>
            <div class="lower-right">
                <div class="archive-index">
                    <div class="archive-index-header">ARCHIVE INDEX</div>
                    <div class="archive-index-list" id="index-list"></div>
                </div>

                <div class="landing-links">
                    <a href="https://www.pinterest.com" target="_blank" rel="noopener">Pinterest</a>
                    <a href="gallery.html">Tunnel</a>
                </div>
            </div>
        </section>
    </div>

    <script src="landing.js"></script>
</body>
</html>
