<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Archive</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <!-- 로그인 상태 표시 + 로그인/회원가입 진입점 -->
    <div id="auth-widget" class="auth-widget">
        <div id="auth-logged-out" class="auth-logged-out">
            <button id="auth-login-btn" class="auth-btn">LOG IN</button>
        </div>
        <div id="auth-logged-in" class="auth-logged-in hidden">
            <a id="auth-my-archive" class="auth-btn" href="gallery.html">MY ARCHIVE</a>
            <span id="auth-username" class="auth-username"></span>
            <button id="auth-logout-btn" class="auth-btn-text">LOG OUT</button>
        </div>
    </div>

    <!-- 로그인 / 회원가입 모달 -->
    <div id="auth-modal" class="auth-modal hidden">
        <div class="auth-modal-card">
            <button id="auth-modal-close" class="auth-modal-close" aria-label="닫기">&times;</button>
            <div class="oauth-buttons">
                <button type="button" id="oauth-google-btn" class="oauth-btn oauth-btn-google">
                    <svg class="oauth-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2582h2.9087c1.7018-1.5668 2.6836-3.8741 2.6836-6.6151z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.4673-.8059 5.9564-2.1805l-2.9087-2.2582c-.8059.54-1.8368.8591-3.0477.8591-2.3441 0-4.3282-1.5831-5.036-3.7104H.9573v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
                        <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2822-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z"/>
                        <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.4259 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z"/>
                    </svg>
                    구글로 계속하기
                </button>
                <button type="button" id="oauth-kakao-btn" class="oauth-btn oauth-btn-kakao">
                    <svg class="oauth-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill="#191919" d="M10 2C5.03 2 1 5.202 1 9.15c0 2.526 1.66 4.75 4.163 6.02-.183.68-.664 2.472-.76 2.856-.12.472.173.466.364.34.15-.1 2.386-1.62 3.354-2.278.606.087 1.233.132 1.879.132 4.97 0 9-3.202 9-7.15S14.97 2 10 2z"/>
                    </svg>
                    카카오로 계속하기
                </button>
            </div>
            <div class="auth-divider"><span>또는</span></div>

            <div class="auth-tabs">
                <button id="auth-tab-login" class="auth-tab active">LOG IN</button>
                <button id="auth-tab-signup" class="auth-tab">SIGN UP</button>
            </div>

            <form id="auth-login-form" class="auth-form">
                <input type="email" id="login-email" class="auth-input" placeholder="이메일" required autocomplete="email">
                <input type="password" id="login-password" class="auth-input" placeholder="비밀번호" required autocomplete="current-password">
                <button type="submit" class="auth-submit">로그인</button>
                <div id="login-error" class="auth-error"></div>
            </form>

            <form id="auth-signup-form" class="auth-form hidden">
                <input type="text" id="signup-username" class="auth-input" placeholder="사용자명 (2~20자, 공백 없이)" required autocomplete="username">
                <input type="email" id="signup-email" class="auth-input" placeholder="이메일" required autocomplete="email">
                <input type="password" id="signup-password" class="auth-input" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="new-password">
                <button type="submit" class="auth-submit">회원가입</button>
                <div id="signup-error" class="auth-error"></div>
            </form>
        </div>
    </div>

    <!-- 구글/카카오처럼 사용자명을 안 받는 방식으로 처음 가입했을 때, 로그인 직후
         딱 한 번 사용자명을 정하게 하는 모달 (임시 사용자명이 입력창에 미리 채워져
         있어서, 마음에 들면 그대로 저장 버튼만 눌러도 된다) -->
    <div id="username-setup-modal" class="auth-modal hidden">
        <div class="auth-modal-card">
            <p class="username-setup-title">환영합니다! 사용하실 사용자명을 정해주세요.</p>
            <form id="username-setup-form" class="auth-form">
                <input type="text" id="username-setup-input" class="auth-input" placeholder="사용자명 (2~20자, 공백 없이)" required autocomplete="username">
                <button type="submit" class="auth-submit">저장하고 계속하기</button>
                <div id="username-setup-error" class="auth-error"></div>
            </form>
        </div>
    </div>

    <div class="landing">
        <section class="landing-banner">
            <div class="marquee-viewport">
                <div class="marquee-track" id="marquee-track"></div>
            </div>
            <div class="banner-overlay">
                <h1 class="banner-title">PINTEREST<br>ARCHIVE</h1>
            </div>
            <span class="banner-eye" aria-hidden="true">◉</span>
        </section>

        <section class="landing-lower">
            <div class="lower-left">
                <span class="vertical-label">Archive*</span>
                <a href="gallery.html" class="enter-link">ENTER<br>ARCHIVE →</a>
            </div>
            <div class="lower-right">
                <div class="archive-index">
                    <div class="archive-index-header">ARCHIVE INDEX</div>
                    <div class="archive-index-list" id="index-list"></div>
                </div>

                <!-- 로그인했을 때만 보이는 팔로잉 목록 + 사용자명으로 팔로우하기 -->
                <div id="following-section" class="following-section hidden">
                    <div class="archive-index-header">FOLLOWING</div>
                    <div class="following-list" id="following-list"></div>
                    <form id="follow-form" class="follow-form">
                        <input type="text" id="follow-username-input" class="follow-input" placeholder="사용자명으로 팔로우">
                        <button type="submit" class="follow-submit">Follow</button>
                    </form>
                    <div id="follow-status" class="follow-status"></div>
                </div>

                <div class="landing-links">
                    <a href="https://www.pinterest.com" target="_blank" rel="noopener">Pinterest</a>
                    <a href="gallery.html">Tunnel</a>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
    <script src="supabase-client.js"></script>
    <script src="landing-auth.js"></script>
    <script src="landing.js"></script>
</body>
</html>
